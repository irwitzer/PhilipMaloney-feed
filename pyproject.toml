[project]
name = "maloney-feed"
version = "0.1.0"
description = "Inoffizieller RSS-Podcast-Feed für Philip Maloney von SRF."
readme = "README.md"
authors = [
    { name = "irwitzer", email = "63697276+irwitzer@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.61.0",
]

[project.scripts]
maloney-feed = "maloney_feed.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
