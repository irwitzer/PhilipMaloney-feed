name: Update and publish feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-feed.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "tests/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build feed
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.15"
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run --frozen pytest

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Build feed from current SRF data
        run: uv run --frozen python scripts/build-feed.py

      - name: Validate generated feed
        run: uv run --frozen python scripts/validate-feed.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
